[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hallyu-twins"
version = "0.1.0"
description = "Grounded, networked LLM digital twins for replicating the 30-country Overseas Hallyu Survey (KOFICE) with SSR elicitation"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "statsmodels>=0.14",
  "pyyaml>=6.0",
  "matplotlib>=3.8",
]

[project.scripts]
hallyu-twins = "hallyu_twins.cli:main"

[project.optional-dependencies]
spss = ["pyreadstat>=1.2"]
openai = ["openai>=1.40"]
anthropic = ["anthropic>=0.40"]
gemini = ["google-genai>=0.3"]
onnx = ["onnxruntime>=1.18", "tokenizers>=0.15"]
local = ["sentence-transformers>=3.0"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["hallyu_twins*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
